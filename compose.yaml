services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_local
      POSTGRES_DB: todos
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-todos.sql:ro
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'todo', '-d', 'todos']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
